name: Protected sales integration

on:
  workflow_dispatch:
  push:
    branches: ["codex/**"]
    paths:
      - ".github/workflows/sales-integration.yml"
      - "integration/**"
      - "supabase/migrations/20260924074555_protected_sales_foundation.sql"
      - "package.json"
      - "package-lock.json"

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - run: npm run test:sales-db
      - run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  protected-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: integration/package-lock.json
      - run: npm ci --prefix integration
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Add protected sale migration to disposable project
        run: cp supabase/migrations/20260924074555_protected_sales_foundation.sql integration/supabase/migrations/
      - name: Start local Supabase services
        run: supabase --workdir integration start
      - name: Exercise Auth, Storage, API, and RLS
        run: node integration/test-sales-api.mjs
